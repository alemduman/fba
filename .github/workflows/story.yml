name: Story (разовая)

on:
  schedule:
    # 07:50 UTC = 11:50 по Баку, 8 ноября. Скрипт дожидается 08:00 UTC (12:00 Баку) и публикует. Другие даты скрипт пропускает.
    - cron: '50 7 8 11 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Проверка без публикации'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  story:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Опубликовать сторис
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          STORY_IMAGE: assets/story-board.jpg
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ONLY_DATE: ${{ github.event_name == 'schedule' && '2026-11-08' || '' }}
          WAIT_UNTIL: ${{ github.event_name == 'schedule' && '2026-11-08T08:00:00Z' || '' }}
        run: node scripts/story.mjs

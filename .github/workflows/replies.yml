name: Ответы на комментарии

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Проверка: показать ответы, но не отправлять'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: replies
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Ответить на новые комментарии
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCOUNT_DESC: 'Битва флагов: короткие видео, где флаги стран сражаются друг с другом, побеждает последний выживший'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/replies.mjs

name: Flag Battle autopost

on:
  schedule:
    # Время в UTC: Баку = UTC + 4. '17 15 * * *' = каждый день в 19:17 по Баку.
    # Несколько публикаций в день: добавь ещё строки «- cron: ...» (примеры в README).
    # Пока в config.json стоит "autoPublish": false, запуски по расписанию ничего не делают.
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Проверка: сделать видео, но НЕ публиковать'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Установить зависимости
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -n 1

      - name: Сделать ролик
        id: render
        run: node scripts/render.mjs

      - uses: actions/configure-pages@v6
        if: steps.render.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.render.outputs.skip != 'true'
        with:
          path: out/site

      - name: Выложить видео по публичной ссылке (GitHub Pages)
        id: deploy
        if: steps.render.outputs.skip != 'true'
        uses: actions/deploy-pages@v5

      - name: Опубликовать в Instagram
        id: publish
        if: steps.render.outputs.skip != 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/publish.mjs

      - name: Запомнить, что уже опубликовано
        if: steps.publish.outputs.posted == 'true'
        run: |
          git config user.name "flag-battle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -q -m "Опубликован ролик $(date -u +%F)" || exit 0
          git pull -q --rebase
          git push -q

name: Flag Battle autopost

on:
  schedule:
    # Время в UTC: Баку = UTC + 4. Семь роликов в день: 10:07, 12:07, 14:07, 16:07, 18:07, 20:07, 22:07 по Баку.
    # (Минута :07, а не :00: в начале часа у GitHub очередь и запуски опаздывают сильнее.)
    # Пока в config.json "autoPublish": false или не наступила "startDate", запуски по расписанию ничего не делают.
    - cron: '7 6,8,10,12,14,16,18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Проверка: сделать видео, но НЕ публиковать'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Установить зависимости
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -n 1

      - name: Сделать ролик
        id: render
        run: node scripts/render.mjs

      - uses: actions/configure-pages@v6
        if: steps.render.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.render.outputs.skip != 'true'
        with:
          path: out/site

      - name: Выложить видео по публичной ссылке (GitHub Pages)
        id: deploy
        if: steps.render.outputs.skip != 'true'
        uses: actions/deploy-pages@v5

      - name: Опубликовать в Instagram
        id: publish
        if: steps.render.outputs.skip != 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/publish.mjs

      - name: Загрузить на YouTube Shorts
        if: steps.render.outputs.skip != 'true'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/youtube.mjs

      - name: Запомнить, что уже опубликовано
        if: steps.publish.outputs.posted == 'true'
        run: |
          git config user.name "flag-battle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -q -m "Опубликован ролик $(date -u +%F)" || exit 0
          git pull -q --rebase
          git push -q

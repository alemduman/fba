name: Token info (диагностика)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  info:
    runs-on: ubuntu-24.04
    steps:
      - name: Показать приложение и права токена
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          curl -s "https://graph.facebook.com/v26.0/debug_token?input_token=$IG_TOKEN&access_token=$IG_TOKEN" | python3 -c "
          import sys,json,datetime
          d=json.load(sys.stdin).get('data',{})
          print('app_id:',d.get('app_id'),'| app:',d.get('application'))
          print('type:',d.get('type'),'| valid:',d.get('is_valid'))
          e=d.get('expires_at'); print('expires:', 'never' if not e else datetime.datetime.utcfromtimestamp(e))
          print('scopes:',', '.join(d.get('scopes',[])))
          print('error:',d.get('error'))
          "

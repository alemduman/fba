name: Instagram статистика
on:
  workflow_dispatch:
    inputs:
      media_id:
        description: 'ID одного ролика для проверки (необязательно)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Собрать статистику
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_ID: ${{ inputs.media_id }}
        run: node scripts/insights.mjs
